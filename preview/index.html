<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pesquisa de satisfação – 2º Registro de Imóveis de São José dos Campos</title>
<style>
:root{--b50:#f4f7ef;--b100:#e6eeda;--b500:#5c7f3c;--b700:#3d5c2a;--b800:#2e4620;--b900:#223518;--n50:#f8f8f5;--n100:#eff0ea;--n200:#dfe1d8;--n300:#c4c7ba;--n400:#85897a;--n700:#43473a;--n900:#1a1c16;--danger:#9b2115;--dangerbg:#fdefed}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,"Segoe UI",Roboto,Arial,sans-serif;font-size:1.0625rem;line-height:1.6;color:var(--n900);background:var(--n50)}
a{color:var(--b700)}
.skip{position:absolute;left:-999px}.skip:focus{left:1rem;top:1rem;background:#fff;padding:.5rem;z-index:9}
header.top{background:#fff;border-bottom:1px solid var(--n200);padding:.75rem 1rem}
header.top div{max-width:60rem;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
header.top strong{color:var(--b800)}
header.top a{font-weight:600}
.hero{background:var(--b800);color:#fff;padding:2.5rem 1rem 4rem;text-align:center}
.hero h1{margin:0 0 .5rem;font-size:clamp(1.75rem,4vw,2.5rem);line-height:1.2}
.hero p{margin:0 auto;max-width:36rem;color:var(--b100)}
main{padding:0 1rem 3rem}
.card{max-width:46rem;margin:-2.5rem auto 0;background:#fff;border:1px solid var(--n200);border-radius:.75rem;padding:1.5rem;box-shadow:0 2px 12px rgba(0,0,0,.08)}
@media(max-width:40rem){.card{padding:1rem}}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
.counter{margin:0;font-weight:700;color:var(--b800);font-size:1.1875rem}.pct{margin:0;font-size:.9375rem;color:var(--n700)}
.track{height:.75rem;margin-top:.5rem;background:var(--n100);border:1px solid var(--n300);border-radius:999px;overflow:hidden}
.bar{height:100%;background:var(--b700);transition:width .25s}
.stepper{display:flex;justify-content:space-between;list-style:none;padding:0;margin:.75rem 0 0}
.stepper li{width:2rem;height:2rem;display:grid;place-items:center;border-radius:50%;border:2px solid var(--n400);font-size:.9375rem;font-weight:600;color:var(--n700);background:#fff}
.stepper li.current{background:var(--b700);border-color:var(--b700);color:#fff;outline:2px solid var(--b700);outline-offset:2px}
.stepper li.done{background:var(--b100);border-color:var(--b700);color:var(--b800)}
h2{margin:1.5rem 0 .25rem;font-size:1.75rem;line-height:1.2;color:var(--b900)}
h2:focus{outline:none}h2:focus-visible{outline:3px solid var(--b700);outline-offset:4px}
.muted,.hint{color:var(--n700)}.muted{margin:0 0 .5rem}.hint{margin:0 0 .5rem;font-size:.9375rem}
fieldset{border:0;padding:0;margin:1.5rem 0 0;min-width:0}
fieldset.invalid,.field.invalid{border-left:4px solid var(--danger);padding-left:.75rem}
legend,label.l{display:block;padding:0;font-weight:600;margin-bottom:.5rem}
.tag{font-weight:400;font-size:.9375rem;color:var(--n700)}
.err{margin:0 0 .5rem;font-weight:600;color:var(--danger);font-size:.9375rem}
.list{display:grid;gap:.5rem;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr))}
.scale{display:grid;gap:.5rem;grid-template-columns:repeat(5,1fr)}
@media(max-width:40rem){.list,.scale{grid-template-columns:1fr}}
.opt{position:relative;display:flex;align-items:center;gap:.625rem;min-height:3rem;padding:.5rem .75rem;border:2px solid var(--n300);border-radius:.5rem;background:#fff;cursor:pointer}
.scale .opt{flex-direction:column;justify-content:center;text-align:center;font-size:.9375rem;gap:.375rem}
@media(max-width:40rem){.scale .opt{flex-direction:row;text-align:left;font-size:1.0625rem}}
.opt:hover{border-color:var(--b500);background:var(--b50)}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt:has(input:focus-visible){outline:3px solid var(--b700);outline-offset:2px}
.opt.on{border-color:var(--b700);background:var(--b100);font-weight:700;box-shadow:inset 0 0 0 1px var(--b700)}
.mark{flex:none;width:1.5rem;height:1.5rem;display:grid;place-items:center;border:2px solid #6c705f;border-radius:.25rem;background:#fff;font-weight:700;color:#fff}
.opt.on .mark{background:var(--b700);border-color:var(--b700)}.opt.radio .mark{border-radius:50%}
.input{width:100%;padding:.625rem .75rem;font:inherit;border:2px solid var(--n400);border-radius:.5rem;min-height:3rem;background:#fff;color:inherit}
.input:focus-visible{outline:3px solid var(--b700);outline-offset:2px}.input[aria-invalid=true]{border-color:var(--danger)}
.follow{margin-top:1rem;padding:1rem;background:var(--n50);border:1px solid var(--n200);border-radius:.5rem}
.summary{margin-top:1.25rem;padding:.75rem 1rem;border:2px solid var(--danger);border-radius:.5rem;background:var(--dangerbg);color:var(--danger)}
.summary p{margin:0 0 .25rem}.summary ul{margin:0;padding-left:1.25rem}.summary a{color:inherit}
.summary:focus-visible{outline:3px solid var(--b700);outline-offset:2px}
.actions{display:flex;justify-content:space-between;gap:.75rem;margin-top:2rem}
@media(max-width:40rem){.actions{flex-direction:column-reverse}.actions>*{width:100%}}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:3rem;padding:.5rem 1.5rem;border-radius:.5rem;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;border:2px solid var(--b700)}
.btn.p{background:var(--b700);color:#fff}.btn.p:hover{background:var(--b800)}
.btn.s{background:#fff;color:var(--b800)}.btn.s:hover{background:var(--b50)}
.btn:focus-visible{outline:3px solid var(--b700);outline-offset:3px}.btn:disabled{opacity:.65;cursor:progress}
.banner{max-width:46rem;margin:1rem auto 0;padding:.5rem 1rem;background:#fbf0d5;color:#7a5410;border-radius:.5rem;font-size:.9375rem}
footer{text-align:center;color:var(--n700);font-size:.9375rem;padding:1rem}
/* ===== Animações e fluidez ===== */
html{scroll-behavior:smooth}
.hero{background:linear-gradient(120deg,var(--b900),var(--b700),var(--b800));background-size:200% 200%;animation:heroShift 14s ease infinite}
.hero h1,.hero p{animation:fadeUp .6s cubic-bezier(.2,.8,.2,1) both}.hero p{animation-delay:.1s}
#app{animation:cardIn .55s cubic-bezier(.2,.8,.2,1) both}
.bar{transition:width .6s cubic-bezier(.65,0,.35,1)}
.stepper li{transition:background .3s,border-color .3s,color .3s}
.stepper li.current{animation:dotPop .4s cubic-bezier(.3,1.6,.5,1)}
.swap.fwd>*{animation:slideFwd .45s cubic-bezier(.2,.8,.2,1) both}
.swap.back>*{animation:slideBack .45s cubic-bezier(.2,.8,.2,1) both}
.swap>*:nth-child(1){animation-delay:0s}.swap>*:nth-child(2){animation-delay:.05s}.swap>*:nth-child(3){animation-delay:.1s}
.swap>*:nth-child(4){animation-delay:.15s}.swap>*:nth-child(5){animation-delay:.2s}.swap>*:nth-child(6){animation-delay:.25s}
.swap>*:nth-child(n+7){animation-delay:.3s}
.opt{transition:border-color .2s,background-color .2s,box-shadow .2s,transform .15s}
.opt:hover{transform:translateY(-1px)}.opt:active{transform:scale(.98)}
.opt.pop .mark{animation:markPop .35s cubic-bezier(.3,1.6,.5,1)}
.opt.pop{animation:optFlash .5s ease}
.mark{transition:background-color .2s,border-color .2s}
fieldset.invalid,.field.invalid{animation:shake .4s}
.summary{animation:fadeUp .3s ease both}
.reveal{animation:reveal .4s cubic-bezier(.2,.8,.2,1) both;transform-origin:top}
.btn{transition:background-color .2s,transform .15s,box-shadow .2s}
.btn.p:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(61,92,42,.35)}.btn:active{transform:scale(.97)}
.input{transition:border-color .2s,box-shadow .2s}.input:focus{box-shadow:0 0 0 4px var(--b100)}
.spin{width:1.1rem;height:1.1rem;margin-right:.6rem;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.ok{width:5rem;height:5rem;display:block;margin:0 0 1rem}
.ok circle{fill:var(--b100);stroke:var(--b700);stroke-width:3;stroke-dasharray:166;stroke-dashoffset:166;animation:draw .6s .1s ease forwards}
.ok path{fill:none;stroke:var(--b700);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:48;stroke-dashoffset:48;animation:draw .4s .6s ease forwards}
.done-in>*{animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) both}.done-in>*:nth-child(2){animation-delay:.1s}.done-in>*:nth-child(3){animation-delay:.2s}.done-in>*:nth-child(4){animation-delay:.3s}.done-in>*:nth-child(5){animation-delay:.4s}
@keyframes heroShift{50%{background-position:100% 50%}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.985)}to{opacity:1;transform:none}}
@keyframes slideFwd{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes slideBack{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes dotPop{0%{transform:scale(.7)}100%{transform:scale(1)}}
@keyframes markPop{0%{transform:scale(.5)}100%{transform:scale(1)}}
@keyframes optFlash{0%{box-shadow:0 0 0 0 rgba(92,127,60,.5)}100%{box-shadow:inset 0 0 0 1px var(--b700),0 0 0 8px rgba(92,127,60,0)}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes reveal{from{opacity:0;transform:translateY(-8px) scaleY(.9)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes draw{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<a class="skip" href="#conteudo">Pular para o conteúdo</a>
<header class="top"><div><strong>2º Registro de Imóveis de São José dos Campos</strong><a href="https://2registrosaojose.com.br/">Voltar ao site</a></div></header>
<section class="hero">
  <h1>Pesquisa de satisfação</h1>
  <p>Sua opinião nos ajuda a melhorar o atendimento. São 6 etapas curtas, em cerca de 2 minutos.</p>
</section>
<main id="conteudo">
  <div class="banner" id="banner" hidden></div>
  <div id="app"></div>
</main>
<footer>R. Vilaça, 235 – Centro · Segunda a sexta, das 9h às 16h · <a href="https://2registrosaojose.com.br/privacidade/">Privacidade</a></footer>

<script>
/* ===== Configuração de envio =====
   ENDPOINT: URL que recebe o POST JSON. Vazio = envio NÃO configurado (mostra erro).
   Abra com ?demo=1 para simular a tela de sucesso apenas para visualização. */
const ENDPOINT = "";
const DEMO = new URLSearchParams(location.search).has("demo");

const o=(...a)=>a.map(l=>({value:l,label:l}));
const AV=o("Muito ruim","Ruim","Regular","Bom","Excelente");
const SAT=o("Muito insatisfeito","Insatisfeito","Neutro","Satisfeito","Muito satisfeito");
const rate=(id,label)=>({id,label,type:"single",required:true,layout:"scale",options:AV});
const STEPS=[
 {title:"Perfil e canais",desc:"Conte-nos um pouco sobre você e como falou com o cartório.",q:[
  {id:"perfil",label:"Qual é o seu segmento/perfil?",type:"single",required:true,layout:"list",options:o("Advogado","Banco","Construtora","Despachante","Empresário","Imobiliária","Incorporadora","Indústria","Pessoa Física","Outro")},
  {id:"canais",label:"Quais canais de atendimento você utiliza?",help:"Você pode marcar mais de uma opção.",type:"multi",required:true,layout:"list",options:o("Presencial","Telefone","WhatsApp","Site","Redes Sociais")}]},
 {title:"Empatia",desc:"Sobre como você foi recebido(a) e ouvido(a).",q:[
  {id:"atendente_auxiliou",label:"O atendente auxiliou na resolução da sua demanda?",type:"single",required:true,layout:"list",options:o("Sim, totalmente","Em parte","Não")},
  {id:"sentimento",label:"Como você está se sentindo após o atendimento?",type:"single",required:true,layout:"scale",options:SAT},
  {id:"expectativas",label:"O atendimento atendeu às suas expectativas?",type:"single",required:true,layout:"list",options:o("Superou","Atendeu","Atendeu em parte","Não atendeu")}]},
 {title:"Atendimento",desc:"Avalie cada item de “Muito ruim” a “Excelente”.",q:[
  rate("tempo_espera","Tempo de espera"),rate("atendimento_juridico","Atendimento jurídico"),
  rate("tempo_dedicado","Tempo dedicado pelo colaborador"),rate("clareza","Clareza das informações recebidas")]},
 {title:"Ambiente e acessibilidade",desc:"Avalie o espaço físico e os canais que você utilizou.",q:[
  rate("instalacoes","Instalações"),rate("localizacao","Localização"),rate("canais_utilizados","Canais de atendimento utilizados"),
  {id:"acessibilidade",label:"Se você utilizou ou precisou dos recursos de acessibilidade (rampas, sinalização em braile, atendimento a pessoas com deficiência), como avalia a adequação deles?",help:"Pergunta opcional. Se não precisou desses recursos, escolha a opção correspondente.",type:"single",required:false,layout:"list",options:o("Atenderam bem","Atenderam em parte","Não atenderam","Não utilizei","Não se aplica")}]},
 {title:"Serviços e recomendação",q:[
  {id:"prazo",label:"A entrega do serviço ocorreu dentro do prazo esperado?",type:"single",required:true,layout:"list",options:o("Sim","Em parte","Não","Ainda não recebi o serviço")},
  {id:"satisfacao_geral",label:"Qual é sua satisfação geral com o atendimento?",type:"single",required:true,layout:"scale",options:SAT},
  {id:"recomendacao",label:"Qual a probabilidade de recomendar o cartório?",help:"100% = com certeza recomendaria; 0% = não recomendaria.",type:"single",required:true,layout:"scale",options:o("100%","80%","50%","25%","0%")}]},
 {title:"Comentários e retorno",desc:"Esta etapa é opcional. Você pode enviar a pesquisa sem preenchê-la.",q:[
  {id:"comentario",label:"Sugestões, elogios ou críticas",type:"text",required:false},
  {id:"retorno",label:"Você deseja receber retorno?",type:"followup",required:false,layout:"list",options:o("Sim","Não")}]}
];
const N=STEPS.length, EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
let step=0, ans={}, errors={}, status="editing", submitError=null, focusTarget=null, dir="fwd", prevPct=0;
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const filled=v=>Array.isArray(v)?v.length>0:!!v&&String(v).trim()!=="";
const labelOf=id=>id==="email"?"E-mail para retorno":(STEPS[step].q.find(q=>q.id===id)||{}).label||id;

function validate(){
  const e={};
  for(const q of STEPS[step].q) if(q.required&&!filled(ans[q.id])) e[q.id]=q.type==="multi"?"Selecione ao menos uma opção.":"Escolha uma opção para continuar.";
  const em=(ans.email||"").trim();
  if(STEPS[step].q.some(q=>q.type==="followup")&&ans.retorno==="Sim"&&em&&!EMAIL_RE.test(em)) e.email="Informe um e-mail válido, como nome@exemplo.com.br, ou deixe o campo em branco.";
  return e;
}
function field(q){
  const err=errors[q.id], tag=`<span class="tag">${q.required?"(obrigatória)":"(opcional)"}</span>`;
  const desc=[q.help?`help-${q.id}`:"",err?`err-${q.id}`:""].filter(Boolean).join(" ");
  const meta=(q.help?`<p id="help-${q.id}" class="hint">${esc(q.help)}</p>`:"")+(err?`<p id="err-${q.id}" class="err"><span aria-hidden="true">⚠ </span>${esc(err)}</p>`:"");
  if(q.type==="text"){
    const v=ans[q.id]||"";
    return `<div class="field${err?" invalid":""}" id="q-${q.id}"><label class="l" for="ta-${q.id}">${esc(q.label)} ${tag}</label>
      <textarea id="ta-${q.id}" class="input" rows="5" maxlength="2000" data-text="${q.id}" ${desc?`aria-describedby="${desc}"`:""}>${esc(v)}</textarea>
      <p class="hint" style="margin-top:.5rem">Não inclua dados sensíveis, como CPF ou senhas. <span id="cnt">${v.length}</span>/2000 caracteres.</p>${meta}</div>`;
  }
  const multi=q.type==="multi", cur=ans[q.id];
  const opts=q.options.map((op,i)=>{
    const on=multi?(cur||[]).includes(op.value):cur===op.value, id=`${q.id}-${i}`;
    return `<label class="opt ${multi?"":"radio"} ${on?"on":""}" for="${id}"><input id="${id}" type="${multi?"checkbox":"radio"}" name="${q.id}" value="${esc(op.value)}" ${on?"checked":""}><span class="mark" aria-hidden="true">${on?"✓":""}</span><span>${esc(op.label)}</span></label>`;
  }).join("");
  let extra="";
  if(q.type==="followup"&&cur==="Sim"){
    const ee=errors.email;
    extra=`<div class="follow reveal"><label class="l" for="q-email">E-mail para retorno <span class="tag">(opcional)</span></label>
      <input id="q-email" class="input" type="email" inputmode="email" autocomplete="email" value="${esc(ans.email||"")}" ${ee?'aria-invalid="true"':""} aria-describedby="${ee?"err-email":"hint-email"}">
      <p id="hint-email" class="hint" style="margin-top:.5rem">Usaremos o e-mail apenas para responder a esta pesquisa. <a href="https://2registrosaojose.com.br/privacidade/">Política de privacidade</a>.</p>
      ${ee?`<p id="err-email" class="err"><span aria-hidden="true">⚠ </span>${esc(ee)}</p>`:""}</div>`;
  }
  return `<fieldset id="q-${q.id}" tabindex="-1" class="${err?"invalid":""}" ${desc?`aria-describedby="${desc}"`:""}><legend>${esc(q.label)} ${tag}</legend>${meta}<div class="${q.layout==="scale"?"scale":"list"}">${opts}</div>${extra}</fieldset>`;
}
function render(){
  if(status==="success"){
    app.innerHTML=`<div class="card done-in" role="status"><svg class="ok" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="26.5"/><path d="M16 29l8 8 16-17"/></svg><h2 id="focus" tabindex="-1" style="margin-top:0">Pesquisa recebida. Obrigado!</h2>
      <p>Sua opinião foi registrada e ajuda o cartório a melhorar o atendimento.${ans.retorno==="Sim"&&(ans.email||"").trim()?" Entraremos em contato pelo e-mail informado.":""}</p>
      <a class="btn p" href="https://2registrosaojose.com.br/">Voltar ao início</a></div>`;
    document.getElementById("focus").focus({preventScroll:true}); scrollCard(); return;
  }
  const cur=STEPS[step], pct=Math.round((step+1)/N*100), ids=Object.keys(errors), sub=status==="submitting", last=step===N-1;
  app.innerHTML=`<form class="card" novalidate aria-labelledby="focus">
    <div class="ph"><p class="counter">Pergunta ${step+1} de ${N}</p><p class="pct">${pct}% concluído</p></div>
    <div class="track" role="progressbar" aria-label="Progresso da pesquisa" aria-valuemin="1" aria-valuemax="${N}" aria-valuenow="${step+1}" aria-valuetext="Etapa ${step+1} de ${N}: ${esc(cur.title)}"><div class="bar" style="width:${prevPct}%"></div></div>
    <ol class="stepper" aria-hidden="true">${STEPS.map((_,i)=>`<li class="${i<step?"done":i===step?"current":""}">${i<step?"✓":i+1}</li>`).join("")}</ol>
    <div class="swap ${dir}"><h2 id="focus" tabindex="-1">${esc(cur.title)}</h2>${cur.desc?`<p class="muted">${esc(cur.desc)}</p>`:""}
    ${ids.length?`<div id="summary" class="summary" tabindex="-1" role="alert"><p><strong>${ids.length===1?"Falta 1 resposta nesta etapa:":`Faltam ${ids.length} respostas nesta etapa:`}</strong></p><ul>${ids.map(id=>`<li><a href="#q-${id}" data-jump="${id}">${esc(labelOf(id))}</a></li>`).join("")}</ul></div>`:""}
    ${cur.q.map(field).join("")}
    ${submitError?`<p role="alert" class="summary"><strong>Erro no envio.</strong> ${esc(submitError)}</p>`:""}
    <div class="actions">${step>0?`<button type="button" class="btn s" data-back ${sub?"disabled":""}>Voltar</button>`:"<span></span>"}
    <button type="submit" class="btn p" ${sub?'disabled aria-busy="true"':""}>${sub?'<span class="spin" aria-hidden="true"></span>Enviando…':last?"Enviar pesquisa":"Avançar"}</button></div></div></form>`;
  const bar=app.querySelector(".bar");
  requestAnimationFrame(()=>requestAnimationFrame(()=>{bar.style.width=pct+"%";}));
  prevPct=pct;
  if(focusTarget){const t=document.getElementById(focusTarget);focusTarget=null;t&&t.focus({preventScroll:true});}
  if(dir) scrollCard();
  dir="";
}
function scrollCard(){const c=app.firstElementChild;if(c&&c.getBoundingClientRect().top<0)c.scrollIntoView({behavior:"smooth",block:"start"});}
function updateSummary(){
  const s=document.getElementById("summary"); if(!s) return;
  const n=Object.keys(errors).length;
  if(!n){s.remove();return;}
  s.querySelector("strong").textContent=n===1?"Falta 1 resposta nesta etapa:":`Faltam ${n} respostas nesta etapa:`;
  s.querySelectorAll("[data-jump]").forEach(a=>{if(!errors[a.dataset.jump])a.closest("li").remove();});
}
app.addEventListener("change",e=>{
  const t=e.target; if(!t.name) return;
  if(t.type==="checkbox"){const l=ans[t.name]||[];ans[t.name]=t.checked?[...l,t.value]:l.filter(v=>v!==t.value);}
  else ans[t.name]=t.value;
  delete errors[t.name];
  /* Atualização pontual: sem redesenhar a etapa inteira (evita piscadas e mantém o foco) */
  const fs=t.closest("fieldset"), q=STEPS[step].q.find(x=>x.id===t.name), id=t.id;
  if(q.type==="followup"){
    fs.outerHTML=field(q); document.getElementById(id).focus({preventScroll:true});
  }else{
    fs.classList.remove("invalid"); fs.querySelectorAll(".err").forEach(n=>n.remove());
    fs.querySelectorAll(".opt").forEach(l=>{
      const on=l.querySelector("input").checked, was=l.classList.contains("on");
      l.classList.toggle("on",on); l.querySelector(".mark").textContent=on?"✓":"";
      if(on&&!was){l.classList.remove("pop");void l.offsetWidth;l.classList.add("pop");}
    });
  }
  updateSummary();
});
app.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.text){ans[t.dataset.text]=t.value;document.getElementById("cnt").textContent=t.value.length;}
  else if(t.id==="q-email"){ans.email=t.value;}
});
app.addEventListener("click",e=>{
  if(e.target.closest("[data-back]")){errors={};submitError=null;step=Math.max(0,step-1);focusTarget="focus";dir="back";render();}
  const j=e.target.closest("[data-jump]");
  if(j){e.preventDefault();const el=document.getElementById("q-"+j.dataset.jump);el&&(el.querySelector("input,textarea")||el).focus();}
});
app.addEventListener("submit",async e=>{
  e.preventDefault(); if(status==="submitting") return;
  errors=validate();
  if(Object.keys(errors).length){focusTarget="summary";render();return;}
  if(step<N-1){step++;focusTarget="focus";dir="fwd";render();return;}
  status="submitting";submitError=null;render();
  const payload={...ans}; if(payload.retorno!=="Sim") delete payload.email; else payload.email=(payload.email||"").trim();
  try{
    if(DEMO){await new Promise(r=>setTimeout(r,700));}
    else{
      if(!ENDPOINT) throw new Error("O envio de pesquisas ainda não está configurado.");
      const res=await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({respostas:payload,enviadoEm:new Date().toISOString()})});
      if(!res.ok) throw new Error("O serviço de recebimento retornou um erro.");
    }
    status="success";
  }catch(err){status="editing";submitError=`${err.message} Suas respostas foram mantidas; tente novamente em instantes.`;focusTarget=null;}
  render();
});
if(DEMO){const b=document.getElementById("banner");b.hidden=false;b.textContent="Modo demonstração: nenhuma resposta será enviada de verdade.";}
render();
</script>
</body>
</html>
